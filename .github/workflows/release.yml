# Release on tag (v*): build the dmg, sign+notarize it IF those secrets are
# configured (otherwise ships ad-hoc signed, which macOS Gatekeeper will warn
# about on first open — that's a deliberate, valid way to launch before
# spending on an Apple Developer account), attach it to a GitHub release,
# and publish the CLI to npm IF NPM_TOKEN is configured. Every optional step
# is skipped, not failed, when its secret is absent, so a tag push works
# today (unsigned, no npm) and gains real signing/publishing later just by
# adding secrets — no workflow edit needed.
#
# Note: `if:` conditions cannot reference the `secrets` context directly
# (GitHub Actions rejects the whole workflow file if they do — it fails
# every run instantly with zero jobs scheduled, which is exactly what
# happened here before this fix). So presence checks are computed once into
# job-level `env` vars below, and steps key off `env.*` instead.
#
# Secrets (all optional — the workflow degrades gracefully without them):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application cert (.p12, base64), + its password
#   FLEET_SIGN_ID           e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (all three needed to notarize)
#   NPM_TOKEN               npm automation token
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && 'true' || '' }}
      HAS_NOTARY: ${{ (secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '') && 'true' || '' }}
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app/VERSION
        run: test "v$(cat app/VERSION)" = "${GITHUB_REF_NAME}"

      - name: Import signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db

      - name: Store notary credentials
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials fleet-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build (+ sign/notarize if configured) the dmg
        env:
          FLEET_SIGN_ID: ${{ secrets.FLEET_SIGN_ID }}
          FLEET_NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'fleet-notary' || '' }}
        run: app/make-dmg.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.FLEET_SIGN_ID != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE="Signed and notarized — opens normally."
          else
            NOTE="**Unsigned build.** macOS will warn it's from an unidentified developer. Right-click (or Control-click) Fleet.app > Open, then click Open again in the dialog — you only need to do this once."
          fi
          gh release create "$GITHUB_REF_NAME" "app/Fleet-$(cat app/VERSION).dmg" \
            --generate-notes --notes "$NOTE"

      - uses: actions/setup-node@v4
        if: ${{ env.HAS_NPM == 'true' }}
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Publish CLI
        if: ${{ env.HAS_NPM == 'true' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
